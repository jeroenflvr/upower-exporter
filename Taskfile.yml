version: "3"

vars:
  BINARY: upower-exporter
  BUILD_DIR: bin

tasks:
  default:
    deps: [build]

  build:
    desc: Build a static linux amd64 binary
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -trimpath -ldflags="-s -w -extldflags '-static'" -o {{.BUILD_DIR}}/{{.BINARY}} .
    sources:
      - "*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
